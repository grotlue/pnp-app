name: Bug
description: Report a reproducible defect.
title: "bug: "
labels:
  - "type:bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      placeholder: |
        When ..., the app ... instead of ...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: User impact
      placeholder: |
        Who is affected?
        Which flow is blocked?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        App env:
        Browser:
        Locale:
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria-fix
    attributes:
      label: Acceptance criteria for fix
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
