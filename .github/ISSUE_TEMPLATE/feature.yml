name: Feature
description: Propose a user-facing or system feature with clear flow and acceptance criteria.
title: "feat: "
labels:
  - type:feature
body:
  - type: markdown
    attributes:
      value: |
        ## Feature request
        Use this template to define a feature clearly enough that planning and implementation can start immediately.

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem statement
      description: What user or business problem are we solving?
      placeholder: |
        Users cannot ...
        This causes ...
    validations:
      required: true

  - type: textarea
    id: target-users
    attributes:
      label: Target users and context
      description: Who is affected and in which situation?
      placeholder: |
        Primary users:
        Context of use:
        Frequency:
    validations:
      required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: Describe the current user flow and current system behavior.
      placeholder: |
        1. User goes to ...
        2. User clicks ...
        3. System currently ...
    validations:
      required: true

  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      description: Describe the intended user-visible behavior.
      placeholder: |
        1. User goes to ...
        2. User clicks ...
        3. System should ...
    validations:
      required: true

  - type: textarea
    id: end-to-end-user-flow
    attributes:
      label: End-to-end user flow
      description: Provide the complete happy path and key alternate/error paths.
      placeholder: |
        Happy path:
        1. ...
        2. ...

        Alternate/error paths:
        - If ..., then ...
        - If ..., then ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List testable criteria. Prefer Given/When/Then format.
      placeholder: |
        - Given ..., when ..., then ...
        - Given ..., when ..., then ...
    validations:
      required: true

  - type: checkboxes
    id: non-functional-requirements
    attributes:
      label: Non-functional requirements
      description: Select all that apply.
      options:
        - label: Security or authorization impact
        - label: Performance impact
        - label: Accessibility impact
        - label: Analytics/observability impact
        - label: Data model or migration impact

  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: Explicitly define in-scope vs out-of-scope.
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: dependencies-risks
    attributes:
      label: Dependencies and risks
      description: Upstream dependencies, blockers, rollout risks, or unknowns.
      placeholder: |
        Dependencies:
        Risks:
        Unknowns:

  - type: textarea
    id: test-plan
    attributes:
      label: Verification plan
      description: How this should be validated (manual + automated).
      placeholder: |
        Automated tests:
        Manual steps:
        Edge cases:
    validations:
      required: true

  - type: textarea
    id: rollout-plan
    attributes:
      label: Rollout and monitoring plan
      description: Release strategy, fallback, and success metrics.
      placeholder: |
        Rollout:
        Monitoring signals:
        Fallback:
