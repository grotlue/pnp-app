name: Feature
description: Propose a user-visible feature.
title: "feat: "
labels:
  - type:feature
body:
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem statement
      placeholder: |
        Users cannot ...
        This causes ...
    validations:
      required: true

  - type: textarea
    id: desired-behavior
    attributes:
      label: Desired behavior
      placeholder: |
        1. User ...
        2. System ...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true

  - type: textarea
    id: e2e-happy-paths
    attributes:
      label: E2E happy paths (critical only)
      placeholder: |
        - FLOW-domain-slug
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: dependencies-risks
    attributes:
      label: Dependencies and risks
      placeholder: |
        Dependencies:
        Risks:

  - type: textarea
    id: test-plan
    attributes:
      label: Verification plan
      placeholder: |
        Automated tests:
        Manual checks:
    validations:
      required: true
