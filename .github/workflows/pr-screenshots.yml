name: PR Screenshots

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=200

      - name: Detect screenshot targets for this PR
        id: targets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/pr-screenshot-targets.mjs

      - name: Enforce screenshot mapping coverage
        if: ${{ steps.targets.outputs.has_unmapped_files == 'true' }}
        run: |
          echo "Unmapped screenshot files detected. Update screenshot mappings:"
          cat <<'EOF'
          ${{ steps.targets.outputs.unmapped_files_markdown }}
          EOF
          exit 1

      - name: Setup Node.js
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        run: yarn install --frozen-lockfile

      - name: Setup Supabase CLI (E2E fixture backend)
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase services (E2E fixture backend)
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        run: supabase start

      - name: Reset local Supabase DB with fixture seed (E2E)
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        run: supabase db reset --local --yes

      - name: Generate .env.local from local Supabase status (E2E)
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        run: ./scripts/update-local-supabase-env.sh

      - name: Build
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        run: yarn build

      - name: Cache Playwright browsers
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        uses: actions/cache@v4
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        run: yarn test:e2e:install

      - name: Capture PR screenshots
        if: ${{ steps.targets.outputs.has_targets == 'true' }}
        env:
          PLAYWRIGHT_WEB_SERVER_CMD: yarn start --port 3000
          PR_SCREENSHOT_DIR: artifacts/pr-screenshots
          PR_SCREENSHOT_TARGETS: ${{ steps.targets.outputs.targets_csv }}
          PR_SCREENSHOT_EXTRA_ROUTES: ${{ steps.targets.outputs.extra_routes_csv }}
        run: yarn test:e2e tests/e2e/pr-screenshots.spec.ts

      - name: Upload PR screenshots artifact
        if: ${{ always() && steps.targets.outputs.has_targets == 'true' }}
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: artifacts/pr-screenshots
          if-no-files-found: ignore

      - name: Publish inline screenshot previews
        if: ${{ always() && steps.targets.outputs.has_targets == 'true' }}
        id: inline_previews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_BRANCH: pr-screenshot-previews
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SCREENSHOT_DIR: artifacts/pr-screenshots
        run: |
          set -euo pipefail

          if ! compgen -G "${SCREENSHOT_DIR}/*.png" > /dev/null; then
            {
              echo "images_markdown<<__EOF__"
              echo "- none (no screenshots were captured)"
              echo "__EOF__"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "${remote_url}" "${PREVIEW_BRANCH}" >/dev/null 2>&1; then
            git clone --depth=1 --branch "${PREVIEW_BRANCH}" "${remote_url}" "${tmp_dir}"
          else
            git clone --depth=1 "${remote_url}" "${tmp_dir}"
            (
              cd "${tmp_dir}"
              git checkout --orphan "${PREVIEW_BRANCH}"
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          (
            cd "${tmp_dir}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            dest_dir="pr-${PR_NUMBER}"
            rm -rf "${dest_dir}"
            mkdir -p "${dest_dir}"
            cp -f "${GITHUB_WORKSPACE}/${SCREENSHOT_DIR}"/*.png "${dest_dir}/"

            git add "${dest_dir}"
            if ! git diff --cached --quiet; then
              git commit -m "chore(screenshots): update PR ${PR_NUMBER} previews (${GITHUB_SHA})"
              git push origin "${PREVIEW_BRANCH}"
            fi

            images_markdown="- none"
            if compgen -G "${dest_dir}/*.png" > /dev/null; then
              images_markdown="$(
                for file in $(find "${dest_dir}" -maxdepth 1 -type f -name '*.png' -exec basename {} \; | sort); do
                  image_url="https://github.com/${GITHUB_REPOSITORY}/blob/${PREVIEW_BRANCH}/${dest_dir}/${file}?raw=1"
                  printf -- "- \`%s\`\n\n![%s](%s)\n\n" "${file}" "${file}" "${image_url}"
                done
              )"
            fi

            {
              echo "images_markdown<<__EOF__"
              echo "${images_markdown}"
              echo "__EOF__"
            } >> "${GITHUB_OUTPUT}"
          )

      - name: Comment inline screenshots on PR
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          HAS_TARGETS: ${{ steps.targets.outputs.has_targets }}
          TARGETS_MD: ${{ steps.targets.outputs.selected_targets_markdown }}
          EXTRA_ROUTES_MD: ${{ steps.targets.outputs.extra_routes_markdown }}
          EXPECTED_FILES_MD: ${{ steps.targets.outputs.expected_files_markdown }}
          CHANGED_FILES_MD: ${{ steps.targets.outputs.changed_files_markdown }}
          HAS_UNMAPPED_FILES: ${{ steps.targets.outputs.has_unmapped_files }}
          UNMAPPED_FILES_MD: ${{ steps.targets.outputs.unmapped_files_markdown }}
          INLINE_IMAGES_MD: ${{ steps.inline_previews.outputs.images_markdown }}
        with:
          script: |
            const marker = '<!-- pr-screenshots -->';
            const issue_number = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const status = process.env.JOB_STATUS ?? 'unknown';
            const hasTargets = process.env.HAS_TARGETS === 'true';
            const targetsMd = process.env.TARGETS_MD ?? '- none';
            const extraRoutesMd = process.env.EXTRA_ROUTES_MD ?? '- none';
            const expectedFilesMd = process.env.EXPECTED_FILES_MD ?? '- none';
            const changedFilesMd = process.env.CHANGED_FILES_MD ?? '- none';
            const hasUnmappedFiles = process.env.HAS_UNMAPPED_FILES === 'true';
            const unmappedFilesMd = process.env.UNMAPPED_FILES_MD ?? '- none';
            const inlineImagesMd = process.env.INLINE_IMAGES_MD ?? '- none';

            const lines = [
              marker,
              `PR screenshots status: \`${status}\``,
              `Workflow run: ${runUrl}`,
              '',
              'Detected target groups:',
              targetsMd,
              '',
              'Detected extra routes:',
              extraRoutesMd,
              '',
              'Inline screenshots:',
              hasTargets ? inlineImagesMd : '- skipped (no relevant UI targets changed).',
              '',
              'Expected screenshots:',
              expectedFilesMd,
              '',
              'Unmapped files requiring mapping updates:',
              hasUnmappedFiles ? unmappedFilesMd : '- none',
              '',
              'Changed files used for detection:',
              changedFilesMd,
            ];
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
