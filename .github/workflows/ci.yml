name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_policy:
    runs-on: ubuntu-latest
    outputs:
      should_run_quality: ${{ steps.policy.outputs.should_run_quality }}
    steps:
      - name: Decide whether quality should run
        id: policy
        uses: actions/github-script@v7
        with:
          script: |
            const event = context.eventName;

            // Always run quality for PR updates.
            if (event === "pull_request") {
              core.setOutput("should_run_quality", "true");
              return;
            }

            // For non-push events, keep behavior safe by running.
            if (event !== "push") {
              core.setOutput("should_run_quality", "true");
              return;
            }

            const branch = context.ref.replace("refs/heads/", "");
            const alwaysRunBranches = new Set(["main", "production"]);
            if (alwaysRunBranches.has(branch)) {
              core.setOutput("should_run_quality", "true");
              return;
            }

            // For feature branches: if an open PR exists from this branch,
            // run quality only on pull_request events to avoid duplicate runs.
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: `${context.repo.owner}:${branch}`,
              per_page: 1,
            });

            core.setOutput("should_run_quality", pulls.length === 0 ? "true" : "false");

  quality:
    needs: run_policy
    if: ${{ needs.run_policy.outputs.should_run_quality == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:run

      - name: Build
        run: yarn build

  deploy_preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: quality
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit

  deploy_production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' }}
    needs: quality
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
