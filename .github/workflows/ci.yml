name: CI

on:
  push:
    branches:
      - main
      - production
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  actions: write
  checks: read
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview_label_gate:
    runs-on: ubuntu-latest
    outputs:
      required_checks_ready: ${{ steps.evaluate.outputs.required_checks_ready }}
      skip_heavy_jobs: ${{ steps.evaluate.outputs.skip_heavy_jobs }}
    steps:
      - name: Evaluate preview-deploy label gate
        id: evaluate
        uses: actions/github-script@v8
        with:
          script: |
            const requiredChecks = ["quality", "e2e_smoke", "db_schema_guardrails"];
            const isPreviewDeployLabelEvent =
              context.eventName === "pull_request" &&
              context.payload.action === "labeled" &&
              context.payload.label?.name === "preview-deploy";

            if (!isPreviewDeployLabelEvent) {
              core.setOutput("required_checks_ready", "false");
              core.setOutput("skip_heavy_jobs", "false");
              return;
            }

            const headSha = context.payload.pull_request.head.sha;
            const currentRunId = Number(process.env.GITHUB_RUN_ID || "0");

            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                per_page: 100,
              },
              (response) => response.data.check_runs,
            );

            const newestByName = new Map();
            for (const run of checkRuns) {
              if (!requiredChecks.includes(run.name)) {
                continue;
              }

              const runIdMatch = /\/actions\/runs\/(\d+)/.exec(run.details_url || "");
              const detailsRunId = runIdMatch ? Number(runIdMatch[1]) : null;
              if (detailsRunId === currentRunId) {
                continue;
              }

              const existing = newestByName.get(run.name);
              if (!existing) {
                newestByName.set(run.name, run);
                continue;
              }

              const existingCompletedAt = existing.completed_at
                ? Date.parse(existing.completed_at)
                : 0;
              const currentCompletedAt = run.completed_at ? Date.parse(run.completed_at) : 0;
              if (currentCompletedAt >= existingCompletedAt) {
                newestByName.set(run.name, run);
              }
            }

            const readiness = requiredChecks.map((name) => ({
              name,
              status: newestByName.get(name)?.status ?? null,
              conclusion: newestByName.get(name)?.conclusion ?? null,
              detailsUrl: newestByName.get(name)?.details_url ?? null,
            }));

            const allRequiredChecksGreen = readiness.every(
              (entry) => entry.conclusion === "success",
            );

            core.info(`preview-deploy gate readiness: ${JSON.stringify(readiness)}`);
            core.setOutput(
              "required_checks_ready",
              allRequiredChecksGreen ? "true" : "false",
            );
            core.setOutput(
              "skip_heavy_jobs",
              allRequiredChecksGreen ? "true" : "false",
            );

  quality:
    needs:
      - preview_label_gate
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.action != 'labeled' ||
        github.event.label.name != 'preview-deploy' ||
        needs.preview_label_gate.outputs.skip_heavy_jobs != 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Notify Vercel (quality)
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - pnp-app: quality"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Format (Prettier)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            changed_files="$(git diff --name-only --diff-filter=ACMRTUXB "origin/${{ github.base_ref }}"...HEAD)"
          else
            changed_files="$(git diff --name-only --diff-filter=ACMRTUXB HEAD~1 HEAD || true)"
          fi

          set --
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              set -- "$@" "$file"
            fi
          done <<EOF
          $changed_files
          EOF

          if [ "$#" -eq 0 ]; then
            echo "No changed files to check."
            exit 0
          fi

          yarn prettier:check "$@"

      - name: Test
        run: yarn test:run

      - name: Build
        run: yarn build

  e2e_smoke:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name != 'preview-deploy' ||
          needs.preview_label_gate.outputs.skip_heavy_jobs != 'true'
        )
      }}
    needs:
      - preview_label_gate
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Supabase CLI (E2E fixture backend)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase services (E2E fixture backend)
        run: supabase start

      - name: Reset local Supabase DB with fixture seed (E2E)
        run: supabase db reset --local --yes

      - name: Generate .env.local from local Supabase status (E2E)
        run: ./scripts/update-local-supabase-env.sh

      - name: Build
        run: yarn build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: yarn test:e2e:install

      - name: E2E smoke tests
        env:
          PLAYWRIGHT_WEB_SERVER_CMD: REQUIRE_ADMIN_MFA=true yarn start --port 3000
        run: yarn test:e2e --grep @smoke

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-smoke-attempt-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Append smoke failure debug summary
        if: ${{ failure() }}
        run: |
          {
            echo "### E2E Smoke Failure Debug"
            echo "- Artifact: \`playwright-artifacts-smoke-attempt-${{ github.run_attempt }}\`"
            echo "- Inspect \`test-results/**/trace.zip\` with: \`npx playwright show-trace <trace.zip>\`"
            echo "- Inspect \`test-results/**/video.webm\` and \`error-context.md\` for retry context"
            echo "- Open \`playwright-report/index.html\` for timeline and locator snapshots"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e_regression:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'e2e-regression')
      }}
    needs:
      - quality
      - e2e_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup Yarn 4.12.0
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Supabase CLI (E2E fixture backend)
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase services (E2E fixture backend)
        run: supabase start

      - name: Reset local Supabase DB with fixture seed (E2E)
        run: supabase db reset --local --yes

      - name: Generate .env.local from local Supabase status (E2E)
        run: ./scripts/update-local-supabase-env.sh

      - name: Build
        run: yarn build

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: .playwright-browsers
          key: ${{ runner.os }}-playwright-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: yarn test:e2e:install

      - name: E2E regression tests
        env:
          PLAYWRIGHT_WEB_SERVER_CMD: REQUIRE_ADMIN_MFA=true yarn start --port 3000
        run: yarn test:e2e --grep @regression --pass-with-no-tests

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts-regression-attempt-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

      - name: Append regression failure debug summary
        if: ${{ failure() }}
        run: |
          {
            echo "### E2E Regression Failure Debug"
            echo "- Artifact: \`playwright-artifacts-regression-attempt-${{ github.run_attempt }}\`"
            echo "- Inspect \`test-results/**/trace.zip\` with: \`npx playwright show-trace <trace.zip>\`"
            echo "- Inspect \`test-results/**/video.webm\` and \`error-context.md\` for retry context"
            echo "- Open \`playwright-report/index.html\` for timeline and locator snapshots"
          } >> "$GITHUB_STEP_SUMMARY"

  db_schema_guardrails:
    needs:
      - preview_label_gate
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        github.event.action != 'labeled' ||
        github.event.label.name != 'preview-deploy' ||
        needs.preview_label_gate.outputs.skip_heavy_jobs != 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase services
        run: supabase start

      - name: Reset local Supabase DB and apply migrations
        run: supabase db reset --local --no-seed --yes

      - name: Check foreign key indexing
        run: ./scripts/check-unindexed-foreign-keys.sh

      - name: Lint local Supabase DB (public schema)
        run: supabase db lint --local --schema public --fail-on warning

  dispatch_deploy_preview_main:
    needs:
      - quality
      - db_schema_guardrails
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Preview DB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-preview.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --data '{"ref":"main","inputs":{"checkout_ref":"${{ github.sha }}"}}'

  dispatch_deploy_production:
    needs:
      - quality
      - db_schema_guardrails
    if: ${{ github.event_name == 'push' && github.ref_name == 'production' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy Production DB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-production.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --data '{"ref":"production","inputs":{"checkout_ref":"${{ github.sha }}"}}'

  dispatch_deploy_pr_preview:
    needs:
      - preview_label_gate
      - quality
      - e2e_smoke
      - db_schema_guardrails
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !startsWith(github.event.pull_request.head.ref, 'pr-screenshot-preview') &&
        (
          github.event.action == 'synchronize' ||
          (github.event.action == 'labeled' && github.event.label.name == 'preview-deploy') ||
          (github.event.action == 'reopened' && contains(github.event.pull_request.labels.*.name, 'preview-deploy'))
        ) &&
        contains(github.event.pull_request.labels.*.name, 'preview-deploy') &&
        (
          needs.preview_label_gate.outputs.required_checks_ready == 'true' ||
          (
            needs.quality.result == 'success' &&
            needs.e2e_smoke.result == 'success' &&
            needs.db_schema_guardrails.result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Deploy PR Preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pr-preview.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --data '{"ref":"main","inputs":{"checkout_ref":"${{ github.event.pull_request.head.sha }}","pr_number":"${{ github.event.pull_request.number }}","pr_head_sha":"${{ github.event.pull_request.head.sha }}"}}'
