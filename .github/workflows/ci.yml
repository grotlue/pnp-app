name: CI

on:
  push:
    branches:
      - main
      - production
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:run

      - name: Build
        run: yarn build

  deploy_preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: quality
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit

  deploy_production:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/production' }}
    needs: quality
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
