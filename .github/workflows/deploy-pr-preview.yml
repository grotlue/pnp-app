name: Deploy PR Preview

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Git ref to checkout.
        required: true
        type: string
      pr_number:
        description: Pull request number.
        required: true
        type: string
      pr_head_sha:
        description: Pull request head SHA.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: deploy-pr-preview-${{ github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  deploy_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
      ADMIN_BOOTSTRAP_USERNAME: ${{ vars.ADMIN_BOOTSTRAP_USERNAME }}
      ADMIN_BOOTSTRAP_DESCRIPTION: ${{ vars.ADMIN_BOOTSTRAP_DESCRIPTION }}
      ADMIN_BOOTSTRAP_LOCALE: ${{ vars.ADMIN_BOOTSTRAP_LOCALE }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate preview DB deploy env
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL and SUPABASE_PROJECT_REF. Set at least one in GitHub environment 'preview'."
            exit 1
          fi

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing preview DB deployment secrets. Set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, and SUPABASE_PROJECT_REF in GitHub environment 'preview'."
            exit 1
          fi

      - name: Validate Vercel credentials
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Missing Vercel credentials. Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID as GitHub secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project (PR preview)
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Reset Supabase DB (preview) and apply migrations
        run: supabase db reset --linked --no-seed --yes

      - name: Lint Supabase DB (PR preview, public schema)
        run: supabase db lint --linked --schema public --fail-on warning

      - name: Inspect Supabase DB outliers (PR preview)
        continue-on-error: true
        run: supabase inspect db outliers --linked

      - name: Ensure admin user (preview)
        run: node scripts/ensure-admin-user.mjs

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN" | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Failed to capture deployment URL from Vercel CLI output."
            exit 1
          fi

          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_HEAD_SHA: ${{ github.event.inputs.pr_head_sha }}
        with:
          script: |
            const marker = '<!-- pr-preview-deploy -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const body = `${marker}
            Preview deployment for label \`preview-deploy\`:
            ${process.env.DEPLOYMENT_URL}

            Commit: \`${process.env.PR_HEAD_SHA}\``;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
