name: Deploy Production DB

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Git ref to checkout.
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy_db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: write
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.sha }}

      - name: Set commit status (deploy DB pending)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_CONTEXT: "Vercel - pnp-app: deploy-production-db"
          STATUS_SHA: ${{ github.event.inputs.checkout_ref || github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${STATUS_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Running database deployment.\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Supabase migrations (production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked

      - name: Lint Supabase DB (production, public schema)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db lint --linked --schema public --fail-on warning

      - name: Inspect Supabase DB outliers (production)
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase inspect db outliers --linked

      - name: Inspect Supabase DB index stats (production advisory)
        id: index_stats
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase inspect db index-stats --linked > /tmp/index-stats.txt

          awk -F'|' '
            /^[[:space:]]*public\.idx_/ {
              name=$1
              unused=$6
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", unused)
              if (unused == "true") print name
            }
          ' /tmp/index-stats.txt > /tmp/unused-indexes.txt

          if [ -s /tmp/unused-indexes.txt ]; then
            echo "has_unused=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_unused=false" >> "$GITHUB_OUTPUT"
          fi

          echo "unused_indexes<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/unused-indexes.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create or update issue for unused indexes (production advisory)
        if: ${{ steps.index_stats.outputs.has_unused == 'true' }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UNUSED_INDEXES: ${{ steps.index_stats.outputs.unused_indexes }}
        with:
          script: |
            const marker = "<!-- db-unused-indexes-production -->";
            const title = "chore(db): review production unused indexes";
            const indexes = (process.env.UNUSED_INDEXES ?? "")
              .split("\n")
              .map((entry) => entry.trim())
              .filter(Boolean);

            if (indexes.length === 0) {
              core.info("No advisory unused indexes detected.");
              return;
            }

            const body = `${marker}
            Supabase advisory detected potentially unused custom indexes in production.

            Detected at: ${new Date().toISOString()}
            Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Indexes:
            ${indexes.map((name) => `- \`${name}\``).join("\n")}

            Notes:
            - This is advisory and does not fail deployment.
            - Validate over representative traffic windows before dropping indexes.`;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated issue #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
            core.info(`Created issue #${created.data.number}`);

      - name: Set commit status (deploy DB final)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_CONTEXT: "Vercel - pnp-app: deploy-production-db"
          STATUS_SHA: ${{ github.event.inputs.checkout_ref || github.sha }}
        run: |
          status_state="failure"
          status_description="Database deployment failed."
          if [ "${{ job.status }}" = "success" ]; then
            status_state="success"
            status_description="Database deployment finished successfully."
          elif [ "${{ job.status }}" = "cancelled" ]; then
            status_state="error"
            status_description="Database deployment was cancelled."
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${STATUS_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --data "{\"state\":\"${status_state}\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"${status_description}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

  bootstrap_admin:
    needs: deploy_db
    if: ${{ needs.deploy_db.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      statuses: write
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.sha }}

      - name: Set commit status (bootstrap admin pending)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_CONTEXT: "Vercel - pnp-app: deploy-production-admin"
          STATUS_SHA: ${{ github.event.inputs.checkout_ref || github.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${STATUS_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --data "{\"state\":\"pending\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"Running admin bootstrap.\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate admin bootstrap env (production)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL and SUPABASE_PROJECT_REF. Set at least one in GitHub environment 'production'."
            exit 1
          fi

      - name: Ensure admin user (production)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
          ADMIN_BOOTSTRAP_USERNAME: ${{ vars.ADMIN_BOOTSTRAP_USERNAME }}
          ADMIN_BOOTSTRAP_DESCRIPTION: ${{ vars.ADMIN_BOOTSTRAP_DESCRIPTION }}
          ADMIN_BOOTSTRAP_LOCALE: ${{ vars.ADMIN_BOOTSTRAP_LOCALE }}
        run: node scripts/ensure-admin-user.mjs

      - name: Set commit status (bootstrap admin final)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_CONTEXT: "Vercel - pnp-app: deploy-production-admin"
          STATUS_SHA: ${{ github.event.inputs.checkout_ref || github.sha }}
        run: |
          status_state="failure"
          status_description="Admin bootstrap failed."
          if [ "${{ job.status }}" = "success" ]; then
            status_state="success"
            status_description="Admin bootstrap finished successfully."
          elif [ "${{ job.status }}" = "cancelled" ]; then
            status_state="error"
            status_description="Admin bootstrap was cancelled."
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${STATUS_SHA}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --data "{\"state\":\"${status_state}\",\"context\":\"${STATUS_CONTEXT}\",\"description\":\"${status_description}\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
